<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisasterAI - Satellite Assessment Pipeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #10B981;
            --bg-base: #0F172A;
            --bg-card: rgba(30, 41, 59, 0.7);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at top right, #1E1B4B, transparent),
                radial-gradient(circle at bottom left, #064E3B, transparent);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #60A5FA, #34D399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .upload-box {
            border: 2px dashed rgba(148, 163, 184, 0.4);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
            transform: translateY(-2px);
        }

        .upload-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-box h3 {
            margin-top: 1rem;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            margin-top: 1rem;
            border-radius: 8px;
            display: none;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        select {
            appearance: none;
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.8rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }

        select:hover,
        select:focus {
            border-color: var(--primary);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), #3B82F6);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(79, 70, 229, 0.39);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results {
            margin-top: 3rem;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .result-card {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .result-card img {
            width: 100%;
            border-radius: 8px;
            margin-top: 1rem;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
        }

        .loader {
            display: none;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--secondary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>DisasterAI</h1>
        <p>Siamese Neural Network Pipeline for Automated Damage Assessment</p>
    </header>

    <div class="container">
        <form id="assessmentForm" enctype="multipart/form-data">
            <div class="upload-section">
                <!-- Pre-Disaster -->
                <div class="upload-box" id="preBox">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="color: #94A3B8;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <h3>Upload Pre-Disaster Image</h3>
                    <p style="font-size: 0.9rem; margin-top: 5px;">drag & drop or click</p>
                    <input type="file" id="preImage" accept="image/*" required
                        onchange="previewFile('preImage', 'prePreview')">
                    <img id="prePreview" class="preview-img">
                </div>

                <!-- Post-Disaster -->
                <div class="upload-box" id="postBox">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="color: #94A3B8;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                    <h3>Upload Post-Disaster Image</h3>
                    <p style="font-size: 0.9rem; margin-top: 5px;">drag & drop or click</p>
                    <input type="file" id="postImage" accept="image/*" required
                        onchange="previewFile('postImage', 'postPreview')">
                    <img id="postPreview" class="preview-img">
                </div>
            </div>

            <div class="controls">
                <div>
                    <label for="disasterType"
                        style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-muted);">Disaster
                        Category</label>
                    <select id="disasterType">
                        <option value="0">Earthquake</option>
                        <option value="1">Flood</option>
                        <option value="2">Hurricane</option>
                        <option value="3">Wildfire</option>
                        <option value="4">Tsunami</option>
                    </select>
                </div>

                <button type="submit" class="btn" id="analyzeBtn" style="display: flex; align-items: center;">
                    Run Assessment Pipeline
                    <div class="loader" id="loader"></div>
                </button>
            </div>
        </form>

        <div class="results" id="resultsArea">
            <h2 style="font-size: 1.8rem; margin-bottom: 1.5rem; text-align: center; color: var(--secondary);">
                Assessment Results</h2>
            <div class="results-grid">
                <div class="result-card">
                    <h3 style="color: #60A5FA;">Building Segmentation</h3>
                    <img id="segResultImg" src="" alt="Segmentation Mask">
                </div>
                <div class="result-card">
                    <h3 style="color: #F87171;">Damage Map</h3>
                    <img id="damageResultImg" src="" alt="Damage Mask">
                </div>
            </div>
        </div>
    </div>

    <script>
        function previewFile(inputId, imgId) {
            const file = document.getElementById(inputId).files[0];
            const preview = document.getElementById(imgId);
            const reader = new FileReader();

            reader.addEventListener("load", function () {
                preview.src = reader.result;
                preview.style.display = "block";
            }, false);

            if (file) {
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('assessmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('analyzeBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('resultsArea');

            btn.disabled = true;
            loader.style.display = "block";
            results.style.display = "none";

            const preFile = document.getElementById('preImage').files[0];
            const postFile = document.getElementById('postImage').files[0];
            const disasterType = document.getElementById('disasterType').value;

            if (!preFile || !postFile) {
                alert("Please upload both images");
                btn.disabled = false;
                loader.style.display = "none";
                return;
            }

            const formData = new FormData();
            formData.append("pre_image", preFile);
            formData.append("post_image", postFile);
            formData.append("disaster_type", disasterType);

            fetch("http://127.0.0.1:8000/ingest", {
                method: "POST",
                body: formData
            })
                .then(res => {
                    if (!res.ok) throw new Error("Server Error");
                    return res.json();
                })
                .then(data => {
                    console.log(data);
                    document.getElementById('segResultImg').src = "data:image/png;base64," + data.seg_base64;
                    document.getElementById('damageResultImg').src = "data:image/png;base64," + data.damage_base64;
                    results.style.display = "block";
                })
                .catch(err => {
                    console.error(err);
                    alert("Error running the AI pipeline: " + err.message);
                })
                .finally(() => {
                    btn.disabled = false;
                    loader.style.display = "none";
                });
        });
    </script>
</body>

</html>
